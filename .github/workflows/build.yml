name: Build VLC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - clean-upload

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Restore libvlcjni dependency
        run: |
          git clone https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          cd libvlcjni
          git checkout 0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6

      - name: Build APK
        run: gradle :application:vlc-android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-debug
          path: application/vlc-android/build/outputs/apk/debug/*.apk
